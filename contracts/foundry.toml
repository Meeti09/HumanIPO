[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
# Deploy.s.sol records the deployed addresses for the frontend and the verify script.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 110
